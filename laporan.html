    <script>
        // =========================================================================
        // 1. KONFIGURASI DAN INISIALISASI
        // =========================================================================

        const auth = firebase.auth();
        const db = firebase.firestore();
        const FINANCE_COLLECTION = 'laporan'; 

        // Data Kategori
        const CATEGORIES = {
            // Kategori Dana Masuk
            Masuk: [
                'Dana Pemerintah', 'Iuran Santri', 'Dana Proposal', 'Dana Donatur', 
                'Dana Donatur Jamaah / Masyarakat', 'Dana Kotak Amal', 'Hasil Kebun', 
                'Hasil Usaha', 'Dana Iuran Sertifikasi Guru', 'Lain-lain (DM)'
            ],
            // Kategori Dana Keluar
            Keluar: [
                'Pengeluaran Pasti (PP)', 'Pengeluaran Tidak Pasti (PTP)', 
                'Pengeluaran Pembangungunan & Perawatan Gedung (P3G)', 'Pengeluaran Sosial (PS)', 
                'Pengeluaran Pembiayaan Perawatan Barang (P3B)', 'Pengeluaran PHBI', 
                'Pengeluaran Lain-Lain (PL2)'
            ]
        };


        // =========================================================================
        // 2. FUNGSI UTILITY (PEMBANTU)
        // =========================================================================

        // Fungsi format rupiah
        function formatRupiah(angka) {
            if (angka === 0 || angka === null || typeof angka === 'undefined') return 'Rp 0';
            const numberString = Math.abs(angka).toString();
            const sisa = numberString.length % 3;
            let rupiah = numberString.substr(0, sisa);
            const ribuan = numberString.substr(sisa).match(/\d{3}/g);

            if (ribuan) {
                const separator = sisa ? '.' : '';
                rupiah += separator + ribuan.join('.');
            }

            return (angka < 0 ? '-Rp ' : 'Rp ') + rupiah;
        }
        
        // Mengisi opsi kategori
        function fillCategoryOptions() {
            const inputKategori = document.getElementById('inputKategori');
            const editKategori = document.getElementById('editKategori');
            
            if (inputKategori) inputKategori.innerHTML = '<option value="">Pilih Kategori</option>';
            if (editKategori) editKategori.innerHTML = '<option value="">Pilih Kategori</option>';

            const allCategories = [...CATEGORIES.Masuk, ...CATEGORIES.Keluar];
            allCategories.forEach(cat => {
                const option = '<option value="' + cat + '">' + cat + '</option>';
                if (inputKategori) inputKategori.innerHTML += option;
                if (editKategori) editKategori.innerHTML += option;
            });
        }

        // Mengatur visibilitas kolom Kategori dan Aksi
        function toggleTableDisplay(isLoggedIn) {
            const kategoriHeader = document.getElementById('kategori-header');
            const aksiHeader = document.getElementById('aksi-header');
            
            const kategoriCells = document.querySelectorAll('#finance-table-body .kategori-cell');
            const aksiCells = document.querySelectorAll('#finance-table-body .aksi-cell');
            
            if (kategoriHeader) kategoriHeader.style.display = isLoggedIn ? '' : 'none';
            if (aksiHeader) aksiHeader.style.display = isLoggedIn ? '' : 'none';

            kategoriCells.forEach(cell => cell.style.display = isLoggedIn ? '' : 'none');
            aksiCells.forEach(cell => cell.style.display = isLoggedIn ? '' : 'none');
        }


        // =========================================================================
            // FUNGSI LOAD DATA (VERSI FINAL TERVERIFIKASI)
            // =========================================================================
            
            async function loadData() {
                const isLoggedIn = !!auth.currentUser;
                const tableBody = document.getElementById('finance-table-body');
                const totalMasukElement = document.getElementById('total-masuk');
                const totalKeluarElement = document.getElementById('total-keluar');
                const saldoAkhirElement = document.getElementById('saldo-akhir');
            
                if (!tableBody) return; 
            
                tableBody.innerHTML = '<tr><td colspan="8" style="text-align: center;">Memuat data...</td></tr>';
            
                try {
                    // PERHATIAN: Pastikan di Baris 35-an, Kakak sudah set: 
                    // const FINANCE_COLLECTION = 'laporan';
            
                    const snapshot = await db.collection(FINANCE_COLLECTION).orderBy("timestamp", "asc").get();
                    let html = '';
                    let saldo = 0;
                    let totalMasuk = 0;
                    let totalKeluar = 0;
                    let no = 1;
            
                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        const docId = doc.id;
            
                        // KONVERSI LEBIH AGRESIF: memastikan semua non-digit dihapus, bahkan karakter tak terlihat (unicode)
                        const danaMasuk = parseInt(String(rawDanaMasuk).replace(/\D/g, '')) || 0;
                        const danaKeluar = parseInt(String(rawDanaKeluar).replace(/\D/g, '')) || 0;
            
                        // Ini akan menghapus titik/koma/Rp dan mengubah "500.000" menjadi 500000
                        const danaMasuk = parseInt(String(rawDanaMasuk).replace(/[^0-9]/g, '')) || 0;
                        const danaKeluar = parseInt(String(rawDanaKeluar).replace(/[^0-9]/g, '')) || 0;
            
                        saldo += danaMasuk - danaKeluar;
                        totalMasuk += danaMasuk;
                        totalKeluar += danaKeluar;
            
                        const saldoColor = saldo < 0 ? 'color: #cc0000;' : 'color: #008000;';
            
                        const kategoriCell = '<td class="kategori-cell">' + (data.kategori || '-') + '</td>';
                        const aksiCell = 
                            '<td class="aksi-cell">' +
                                '<button onclick="editTransactionPrompt(\'' + docId + '\')" class="edit-btn">Edit</button>' +
                                '<button onclick="deleteTransaction(\'' + docId + '\')" class="delete-btn">Hapus</button>' +
                            '</td>';
            
                        html += 
                            '<tr>' +
                                '<td>' + no++ + '</td>' +
                                '<td>' + data.tanggal + '</td>' +
                                '<td style="text-align: left;">' + data.uraian + '</td>' +
                                kategoriCell +
                                '<td class="dana-masuk">' + formatRupiah(danaMasuk) + '</td>' +
                                '<td class="dana-keluar">' + formatRupiah(danaKeluar) + '</td>' +
                                '<td style="' + saldoColor + '">' + formatRupiah(saldo) + '</td>' +
                                aksiCell +
                            '</tr>';
                    });
            
                    if (html === '') {
                        html = '<tr><td colspan="8" style="text-align: center;">Belum ada transaksi yang tercatat.</td></tr>';
                    }
            
                    tableBody.innerHTML = html;
            
                    const finalSaldo = totalMasuk - totalKeluar;
                    const finalSaldoColor = finalSaldo < 0 ? 'color: #cc0000;' : 'color: #008000;';
            
                    if (totalMasukElement) totalMasukElement.textContent = formatRupiah(totalMasuk);
                    if (totalKeluarElement) totalKeluarElement.textContent = formatRupiah(totalKeluar);
                    if (saldoAkhirElement) {
                        saldoAkhirElement.textContent = formatRupiah(finalSaldo);
                        saldoAkhirElement.style.color = finalSaldoColor;
                    }
            
                    toggleTableDisplay(isLoggedIn); 
            
                } catch (error) {
                    console.error("Error loading data: ", error);
                    tableBody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: red;">Gagal memuat data. Cek error console.</td></tr>';
                }
            }

        // Menambah Transaksi
        async function addTransaction() {
            const inputTanggal = document.getElementById('inputTanggal');
            const inputUraian = document.getElementById('inputUraian');
            const inputKategori = document.getElementById('inputKategori');
            const inputMasuk = document.getElementById('inputMasuk');
            const inputKeluar = document.getElementById('inputKeluar');

            if (!inputTanggal.value || !inputUraian.value || !inputKategori.value || (!inputMasuk.value && !inputKeluar.value)) {
                alert('Semua kolom (Tanggal, Uraian, Kategori) harus diisi, dan salah satu dari Dana Masuk/Keluar harus diisi.');
                return;
            }

            const danaMasuk = parseInt(inputMasuk.value.replace(/[^0-9]/g, '')) || 0;
            const danaKeluar = parseInt(inputKeluar.value.replace(/[^0-9]/g, '')) || 0;

            if (danaMasuk > 0 && danaKeluar > 0) {
                alert('Hanya boleh mengisi salah satu: Dana Masuk atau Dana Keluar.');
                return;
            }
            if (danaMasuk === 0 && danaKeluar === 0) {
                alert('Dana Masuk atau Dana Keluar harus diisi.');
                return;
            }

            try {
                await db.collection(FINANCE_COLLECTION).add({
                    tanggal: inputTanggal.value,
                    uraian: inputUraian.value,
                    kategori: inputKategori.value,
                    danaMasuk: danaMasuk,
                    danaKeluar: danaKeluar,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                inputTanggal.value = new Date().toISOString().substring(0, 10);
                inputUraian.value = '';
                inputKategori.value = ''; 
                inputMasuk.value = '';
                inputKeluar.value = '';

                alert('Transaksi berhasil ditambahkan!');
                loadData(); 
            } catch (error) {
                console.error("Error adding document: ", error);
                alert('Gagal menambahkan transaksi: ' + error.message);
            }
        }

        // Menghapus Transaksi
        async function deleteTransaction(docId) {
            if (!confirm('Apakah Anda yakin ingin menghapus transaksi ini?')) return;

            try {
                await db.collection(FINANCE_COLLECTION).doc(docId).delete();
                alert('Transaksi berhasil dihapus!');
                loadData();
            } catch (error) {
                console.error("Error removing document: ", error);
                alert('Gagal menghapus transaksi: ' + error.message);
            }
        }

        // Mengisi Modal Edit
        async function editTransactionPrompt(docId) {
            const modal = document.getElementById('editModal');
            const doc = await db.collection(FINANCE_COLLECTION).doc(docId).get();
            if (!doc.exists) {
                alert('Dokumen tidak ditemukan.');
                return;
            }

            const data = doc.data();

            document.getElementById('editDocId').value = docId;
            document.getElementById('editTanggal').value = data.tanggal;
            document.getElementById('editUraian').value = data.uraian;
            document.getElementById('editKategori').value = data.kategori || ''; 
            document.getElementById('editMasuk').value = data.danaMasuk || '';
            document.getElementById('editKeluar').value = data.danaKeluar || '';
            
            if (modal) modal.style.display = 'block';
        }

        // Menyimpan Perubahan Edit
        async function saveEditChanges() {
            const docId = document.getElementById('editDocId').value;
            const editTanggal = document.getElementById('editTanggal').value;
            const editUraian = document.getElementById('editUraian').value;
            const editKategori = document.getElementById('editKategori').value;
            const editMasuk = document.getElementById('editMasuk').value;
            const editKeluar = document.getElementById('editKeluar').value;

            const danaMasuk = parseInt(editMasuk.replace(/[^0-9]/g, '')) || 0;
            const danaKeluar = parseInt(editKeluar.replace(/[^0-9]/g, '')) || 0;

            if (danaMasuk > 0 && danaKeluar > 0) {
                alert('Hanya boleh mengisi salah satu: Dana Masuk atau Dana Keluar.');
                return;
            }
            if (danaMasuk === 0 && danaKeluar === 0) {
                alert('Dana Masuk atau Dana Keluar harus diisi.');
                return;
            }
            
            if (!editTanggal || !editUraian || !editKategori) {
                alert('Semua kolom (Tanggal, Uraian, Kategori) harus diisi.');
                return;
            }

            try {
                await db.collection(FINANCE_COLLECTION).doc(docId).update({
                    tanggal: editTanggal,
                    uraian: editUraian,
                    kategori: editKategori,
                    danaMasuk: danaMasuk,
                    danaKeluar: danaKeluar,
                });

                alert('Perubahan berhasil disimpan!');
                document.getElementById('editModal').style.display = 'none';
                loadData();
            } catch (error) {
                console.error("Error updating document: ", error);
                alert('Gagal menyimpan perubahan: ' + error.message);
            }
        }


        // =========================================================================
        // 4. FUNGSI AUTHENTIKASI & RESET DATA
        // =========================================================================

        function login() {
            const userEmail = document.getElementById('login-email').value;
            const userPassword = document.getElementById('login-password').value;

            auth.signInWithEmailAndPassword(userEmail, userPassword)
                .then((userCredential) => {
                    console.log("User logged in:", userCredential.user);
                })
                .catch((error) => {
                    console.error("Login failed:", error.message);
                    alert('Login Gagal: ' + error.message);
                });
        }

        function logout() {
            auth.signOut().then(() => {
                console.log("User signed out");
                alert('Anda telah logout.');
            }).catch((error) => {
                console.error("Logout failed:", error.message);
            });
        }

        async function resetData() {
            if (!confirm("PERINGATAN: Anda yakin ingin MENGHAPUS SEMUA DATA TRANSAKSI? Aksi ini tidak bisa dibatalkan!")) return;

            try {
                const snapshot = await db.collection(FINANCE_COLLECTION).get();
                const batch = db.batch();
                snapshot.docs.forEach((doc) => {
                    batch.delete(doc.ref);
                });
                await batch.commit();
                alert('Semua data transaksi berhasil dihapus!');
                loadData();
            } catch (error) {
                console.error("Error resetting data:", error);
                alert("Gagal menghapus semua data: " + error.message);
            }
        }


        // =========================================================================
        // 5. FUNGSI GENERASI PDF (MENGGUNAKAN KONKATENASI STANDAR)
        // =========================================================================
        
        // Fungsi Pembantu: Agregasi data untuk Ringkasan
        async function aggregateDataByCategory() {
            const snapshot = await db.collection(FINANCE_COLLECTION).get();
            const summaryMasukMap = new Map();
            const summaryKeluarMap = new Map();
            let totalMasukGlobal = 0;
            let totalKeluarGlobal = 0;

            snapshot.forEach((doc) => {
                const data = doc.data();
                const kategori = data.kategori || 'Tanpa Kategori';
                const danaMasuk = data.danaMasuk || 0;
                const danaKeluar = data.danaKeluar || 0;

                if (danaMasuk > 0) {
                    summaryMasukMap.set(kategori, (summaryMasukMap.get(kategori) || 0) + danaMasuk);
                    totalMasukGlobal += danaMasuk;
                } else if (danaKeluar > 0) {
                    summaryKeluarMap.set(kategori, (summaryKeluarMap.get(kategori) || 0) + danaKeluar);
                    totalKeluarGlobal += danaKeluar;
                }
            });

            const summaryMasuk = Array.from(summaryMasukMap, ([kategori, jumlah]) => ({ kategori, jumlah }));
            const summaryKeluar = Array.from(summaryKeluarMap, ([kategori, jumlah]) => ({ kategori, jumlah }));
            
            return { summaryMasuk, summaryKeluar, totalMasukGlobal, totalKeluarGlobal };
        }


        // Fungsi Pembantu: Konten PDF Detail (LAMPIRAN)
        async function generatePDFContent(isSummary = false) { 
                
            const isLoggedIn = !!auth.currentUser;

            let saldo = 0; 
            let totalMasuk = 0; 
            let totalKeluar = 0; 
            let no = 1; 
            const showKategoriInPDF = isLoggedIn && !isSummary; 

            snapshot.forEach((doc) => { 
                const data = doc.data(); 
                const danaMasuk = data.danaMasuk || 0; 
                const danaKeluar = data.danaKeluar || 0; 
                saldo += danaMasuk - danaKeluar; 
                totalMasuk += danaMasuk; 
                totalKeluar += danaKeluar; 
                dataToPrint.push({ 
                    no: no++, 
                    tanggal: data.tanggal, 
                    uraian: data.uraian, 
                    kategori: data.kategori || '-', 
                    danaMasuk: formatRupiah(danaMasuk), 
                    danaKeluar: formatRupiah(danaKeluar), 
                    saldo: formatRupiah(saldo), 
                    isDanaMasuk: danaMasuk > 0 
                }); 
            });

                    '<p style="font-size: 10px; margin: 0; color: black;">Khodimul Umat Ngablak Cluwak Pati</p>' +
                '</div>' +
                '<h2 style="font-size: 14px; text-align: center; margin: 15px 0; color: black;">LAPORAN KEUANGAN LAMPIRAN (DETAIL TRANSAKSI)</h2>';
            
            const widthUraian = showKategoriInPDF ? '30%' : '40%';
            const pdfColspan = showKategoriInPDF ? 4 : 3;
            
            let tableHTML = 
                '<table id="pdf-finance-table" style="width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 9.5px; color: black;">' +
                    '<thead>' +

        // FUNGSI UTAMA DOWNLOAD LAMPIRAN (Detail Transaksi)
        window.downloadPDF = async function() { 
            try {
                const content = await generatePDFContent(false); 
                const element = document.createElement('div');
                element.innerHTML = content;
                
                const opt = { 
                    margin: [10, 10, 10, 10], 
                    filename: 'Laporan_Keuangan_LAMPIRAN_' + new Date().toLocaleDateString('id-ID') + '.pdf', 
                    image: { type: 'jpeg', quality: 0.98 }, 
                    html2canvas: { scale: 3, logging: false, useCORS: true }, 
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
                };
                html2pdf().from(element).set(opt).save(); 
            } catch (error) { 
                console.error("Error generating PDF (downloadPDF):", error); 
                alert("Gagal membuat PDF Lampiran. Cek Konsol Browser (F12) untuk detail error.");

        }

        // =========================================================================
        // 6. LISTENER PERUBAHAN STATUS AUTENTIKASI
        // =========================================================================
        
        auth.onAuthStateChanged((user) => { 
            const isLoggedIn = !!user;

            const loginContainer = document.getElementById('login-container');
            const inputControlContainer = document.getElementById('input-control-container');
            
            if (user) { 
                if (loginContainer) loginContainer.style.display = 'none'; 
                if (inputControlContainer) inputControlContainer.style.display = 'block'; 
            } else { 
                if (loginContainer) loginContainer.style.display = 'block'; 
                if (inputControlContainer) inputControlContainer.style.display = 'none'; 
            } 
            
            loadData(); 
        });


        // =========================================================================
        // 7. INISIALISASI & LISTENERS
        // =========================================================================

        function setupModalListeners() {
            const modal = document.getElementById('editModal');
            const closeBtn = document.querySelector('.close-btn');
            const saveBtn = document.getElementById('save-edit-btn');
            
            if (modal) { modal.style.display = 'none'; }
            
            if (closeBtn) { 
                closeBtn.onclick = function() { 
                    if (modal) modal.style.display = 'none'; 
                } 
            }
            
            window.onclick = function(event) { 
                if (modal && event.target == modal) { 
                    modal.style.display = 'none'; 
                } 
            }
            
            if (saveBtn) { saveBtn.onclick = saveEditChanges; }
            
            fillCategoryOptions(); 
        }

        function setupScrollAnimation() {
            const sections = document.querySelectorAll('.section');
            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    } else {
                        // Opsi: hapus 'visible' saat tidak terlihat (agar animasi terulang)
                        // entry.target.classList.remove('visible'); 
                    }
                });
            }, { threshold: 0.1 }); // Trigger saat 10% elemen terlihat

            sections.forEach(section => {
                observer.observe(section);
            });
        }


        document.addEventListener('DOMContentLoaded', () => {
            setupModalListeners();
            setupScrollAnimation(); // Panggil fungsi animasi
        });


        // Expose fungsi ke window (agar bisa dipanggil dari tombol HTML)
        window.login = login;
        window.logout = logout;

        window.resetData = resetData;
        window.deleteTransaction = deleteTransaction; 
        window.editTransactionPrompt = editTransactionPrompt; 
        window.downloadPDF = downloadPDF; // Ditambahkan kembali
        window.downloadSummaryPDF = downloadSummaryPDF; // Ditambahkan kembali
        window.loadData = loadData;
