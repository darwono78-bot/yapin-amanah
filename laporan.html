<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laporan Keuangan | Yayasan</title>

    <script src="https://www.gstatic.com/firebasejs/7.20.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.20.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.20.0/firebase-firestore.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>
    
    <style>
        /* Variabel Warna (Sebagai referensi) */
        :root {
            --green-primary: #27ae60;
            --yellow-secondary: #f1c40f;
            --dark-green-bg: #1e3d2a;
            --container-bg: #2c3e50;
            --table-header-bg: #1a242c;
            --header-bar-bg: #2ecc71;
            --red-logout: #dc3545; /* Merah untuk Logout */
        }
        
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--dark-green-bg);
            color: #ecf0f1;
            text-align: center;
        }
        
        /* Bar Paling Atas (Bright Green) */
        .header-top {
            background-color: var(--header-bar-bg);
            padding: 10px 0;
            text-align: center;
            font-size: 14px;
            color: white;
            font-weight: bold;
        }

        /* Navigasi Bar (Dark Green) */
        nav {
            background-color: var(--dark-green-bg);
            padding: 10px 0;
            text-align: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            margin: 0 5px;
            display: inline-block;
            transition: background-color 0.2s;
        }
        nav a:last-child {
            background-color: var(--green-primary); 
            border-radius: 3px;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            background: var(--container-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        h2 {
            text-align: center;
            color: var(--yellow-secondary);
            margin-bottom: 25px;
        }

        /* --- Kontrol Input & Login --- */
        #login-container, #login-inputs-area, #input-control-container {
            margin-bottom: 25px;
            /* style untuk input-area diambil dari inline style di HTML */
        }
        
        input[type="email"], input[type="password"], input[type="date"], input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px 0;
            display: inline-block;
            border: 1px solid var(--green-primary);
            border-radius: 4px;
            box-sizing: border-box;
            background-color: #3f556d; 
            color: white;
        }

        label {
            color: #ecf0f1;
            font-weight: bold;
        }
        
        button {
            padding: 10px 15px;
            margin-right: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: var(--green-primary);
            color: #ecf0f1;
            transition: background-color 0.3s;
        }
        
        /* --- Tombol Kuning/Emas (Login, Simpan) - STYLE KEREN --- */
        .btn-action, button[onclick*="login"], #save-edit-btn, #login-toggle-btn {
            background-color: var(--yellow-secondary) !important;
            color: #333 !important;
            font-weight: bold;
            
            /* Efek Timbul Keren */
            box-shadow: 0 4px #b88f0b; 
            transition: all 0.15s ease;
            width: 100%; /* Default: Lebar penuh */
            margin-top: 15px;
        }

        /* Tombol Toggle tidak harus lebar penuh */
        #login-toggle-btn {
            width: auto; 
        }
        
        .btn-action:hover, button[onclick*="login"]:hover, #save-edit-btn:hover, #login-toggle-btn:hover {
            background-color: #f39c12 !important;
            box-shadow: 0 6px #b88f0b;
            transform: translateY(-2px);
        }

        .btn-action:active, button[onclick*="login"]:active, #save-edit-btn:active, #login-toggle-btn:active {
            background-color: #b88f0b !important;
            box-shadow: 0 2px #b88f0b;
            transform: translateY(2px);
        }
        
        /* --- Tombol LOGOUT (Merah Keren) --- */
        .btn-logout {
            float: right;
            background-color: var(--red-logout);
            color: white;
            font-weight: bold;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px #a02833;
            transition: all 0.15s ease;
            margin-top: 10px; /* Jarak dari input */
        }

        .btn-logout:hover {
            background-color: #c82333;
            box-shadow: 0 6px #a02833;
            transform: translateY(-2px);
        }

        .btn-logout:active {
            background-color: #a02833;
            box-shadow: 0 2px #a02833;
            transform: translateY(2px);
        }

        /* --- Tombol Aksi Tabel --- */
        .aksi-btn {
            padding: 5px 10px;
            font-size: 12px;
            margin: 2px;
            background-color: var(--green-primary);
        }
        .aksi-btn[onclick*="deleteTransaction"] { 
            background-color: #e74c3c !important; /* Merah Hapus */
        }
        
        /* --- Tabel Laporan --- */
        #finance-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        #finance-table th, #finance-table td {
            border: 1px solid #45627e; 
            padding: 10px 8px;
            text-align: center;
        }

        #finance-table th {
            background-color: var(--table-header-bg);
            color: var(--yellow-secondary);
        }

        #finance-table tbody tr:nth-child(even) {
            background-color: #34506c;
        }
         #finance-table tbody tr:nth-child(odd) {
            background-color: var(--container-bg);
        }

        /* --- Saldo & Total --- */
        .saldo-plus {
            font-weight: bold;
            color: var(--green-primary);
        }

        .saldo-minus {
            font-weight: bold;
            color: #e74c3c;
        }
        
        .total-row td {
            background-color: #1b2633 !important; 
            font-weight: bold;
            color: var(--yellow-secondary);
            border-top: 2px solid var(--yellow-secondary);
        }

        /* --- Modal Styling --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000; 
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.8); 
        }

        .modal-content {
            background-color: var(--dark-green-bg);
            margin: 10% auto;
            padding: 25px;
            border: 3px solid var(--yellow-secondary);
            width: 90%;
            max-width: 450px;
            border-radius: 10px;
            position: relative;
            box-shadow: 0 0 20px rgba(241, 196, 15, 0.5); 
            text-align: left;
        }
        
        .modal-content h3 {
            color: var(--yellow-secondary);
            text-align: center;
            margin-top: 0;
        }

        .close-btn {
            color: var(--yellow-secondary);
            float: right;
            font-size: 28px;
            font-weight: bold;
            background: none;
            line-height: 1;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header-top">
        Yakin - Akuntabel - Profesional - Integritas - Niat Lillah
    </div>
    <nav>
        <div style="max-width: 1200px; margin: auto; text-align: left;">
            <a href="#">Beranda</a>
            <a href="#">Profil</a>
            <a href="#">Laporan Keuangan</a>
        </div>
    </nav>


    <div class="container">
        <h2>Laporan Pertanggungjawaban Keuangan</h2>
        <p id="auth-status" style="text-align: center;"></p>

        <div id="login-container" style="text-align: center; margin-bottom: 25px;">
            <button onclick="toggleLoginInputs()" id="login-toggle-btn" class="btn-action" style="width: auto;">
                Tampilkan Login Bendahara
            </button>
        </div>

        <div id="login-inputs-area" style="display: none; padding: 15px; border: 2px solid var(--green-primary); border-radius: 5px; background-color: #21303e; text-align: left;">
            <h3>Akses Bendahara</h3>
            <label for="email">Email Bendahara:</label>
            <input type="email" id="email" placeholder="Email Bendahara" required>
            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Password" required>
            
            <button onclick="login()" class="btn-action">Login Sekarang</button>
            <p id="login-error-status" style="color: #e74c3c;"></p>
        </div>


        <div id="input-control-container" style="display: none; padding: 15px; border: 2px solid var(--green-primary); border-radius: 5px; background-color: #21303e; text-align: left;">
            <h3>Input Transaksi Baru</h3>
            <form id="transaction-form">
                <label for="input-tanggal">Tanggal:</label>
                <input type="date" id="input-tanggal" required>
                <label for="input-uraian">Uraian Transaksi:</label>
                <input type="text" id="input-uraian" placeholder="Uraian Transaksi" required>
                <div style="display: flex; gap: 10px;">
                    <div style="flex-grow: 1;">
                         <label for="input-masuk">Dana Masuk (Rp):</label>
                         <input type="number" id="input-masuk" placeholder="0">
                    </div>
                    <div style="flex-grow: 1;">
                        <label for="input-keluar">Dana Keluar (Rp):</label>
                        <input type="number" id="input-keluar" placeholder="0">
                    </div>
                </div>
                <button type="button" onclick="addTransaction()" style="background-color: var(--green-primary);">Tambah Transaksi</button>
                <button type="button" onclick="resetData()" style="background-color: #e74c3c; margin-right: 20px;">Reset Laporan</button>
                <button onclick="logout()" class="btn-logout">Logout</button>
            </form>
        </div>

        <div style="text-align: right; margin-top: 15px;">
            <button onclick="downloadPDF()" style="background-color: #3498db;">Unduh Laporan PDF (Data Lengkap)</button>
        </div>
        
        <table id="finance-table">
            <thead>
                <tr>
                    <th>No</th>
                    <th>Tanggal</th>
                    <th>Uraian</th>
                    <th>Dana Masuk (Rp)</th>
                    <th>Dana Keluar (Rp)</th>
                    <th>Saldo (Rp)</th>
                    </tr>
            </thead>
            <tbody id="finance-body">
                </tbody>
            <tfoot id="finance-footer">
                </tfoot>
        </table>

        <div id="pagination-controls" style="text-align: center; margin-top: 20px;">
            </div>
    </div>
    
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="document.getElementById('editModal').style.display='none'">&times;</span>
            <h3>Edit Transaksi Laporan</h3>
            
            <input type="hidden" id="modal-id">
            
            <label for="edit-tanggal">Tanggal Transaksi:</label>
            <input type="date" id="edit-tanggal" required>
            
            <label for="edit-uraian">Uraian Transaksi:</label>
            <input type="text" id="edit-uraian" placeholder="Uraian Transaksi" required>
            
            <div style="display: flex; gap: 10px;">
                <div style="flex-grow: 1;">
                    <label for="edit-masuk">Dana Masuk (Rp):</label>
                    <input type="number" id="edit-masuk" placeholder="Jumlah Dana Masuk">
                </div>
                <div style="flex-grow: 1;">
                    <label for="edit-keluar">Dana Keluar (Rp):</label>
                    <input type="number" id="edit-keluar" placeholder="Jumlah Dana Keluar">
                </div>
            </div>
            
            <button id="save-edit-btn" class="btn-action" style="margin-top: 20px; width: 100%;">Simpan Perubahan</button>
            <p id="modal-status" style="margin-top: 10px; text-align: center;"></p>
        </div>
    </div>
    
    <script>
        // =========================================================================
        // FIREBASE CONFIG & INISIALISASI
        // =========================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCLFgGblfLTDvploV-tZGYqAajIzT7t0bc",
            authDomain: "laporan-keuangan-yayasan.firebaseapp.com",
            projectId: "laporan-keuangan-yayasan",
            storageBucket: "laporan-keuangan-yayasan.firebasestorage.app",
            messagingSenderId: "616927572689",
            appId: "1:616927572689:web:3961f22c7a7899e71d8bf0"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        const FINANCE_COLLECTION = "laporan"; 
        
        // =========================================================================
        // 1. LOGIKA PAGINATION & GLOBAL VARIABLES
        // =========================================================================
        const rowsPerPage = 10;
        let allDataRows = [];   
        let currentPage = 1;    
        
        function formatRupiah(angka) {
            if (typeof angka !== 'number') {
                angka = parseInt(angka) || 0;
            }
            return new Intl.NumberFormat('id-ID', { style: 'decimal', minimumFractionDigits: 0 }).format(angka);
        }
        
        function displayTablePage(page) {
            currentPage = page; 
            const start = (page - 1) * rowsPerPage;
            const end = start + rowsPerPage;

            allDataRows.forEach(row => row.style.display = 'none');
            allDataRows.slice(start, end).forEach(row => row.style.display = '');

            const paginationDiv = document.getElementById('pagination-controls');
            if(paginationDiv){
                const buttons = paginationDiv.querySelectorAll('button');
                buttons.forEach(btn => btn.classList.remove('active-page'));
                const activeButton = paginationDiv.querySelector(`button[data-page="${page}"]`);
                if (activeButton) {
                    activeButton.classList.add('active-page');
                }
            }
        }

        function setupPagination() {
            const totalRows = allDataRows.length;
            const totalPages = Math.ceil(totalRows / rowsPerPage);
            const paginationDiv = document.getElementById('pagination-controls');
            if (!paginationDiv) return;

            paginationDiv.innerHTML = ''; 

            if (totalRows === 0 || totalPages <= 1) return; 

            const prevButton = document.createElement('button');
            prevButton.innerText = '<<';
            prevButton.addEventListener('click', () => {
                if (currentPage > 1) displayTablePage(currentPage - 1);
            });
            paginationDiv.appendChild(prevButton);

            for (let i = 1; i <= totalPages; i++) {
                const button = document.createElement('button');
                button.innerText = i;
                button.setAttribute('data-page', i);
                button.addEventListener('click', () => displayTablePage(i));
                paginationDiv.appendChild(button);
            }

            const nextButton = document.createElement('button');
            nextButton.innerText = '>>';
            nextButton.addEventListener('click', () => {
                if (currentPage < totalPages) displayTablePage(currentPage + 1);
            });
            paginationDiv.appendChild(nextButton);

            displayTablePage(currentPage > totalPages ? 1 : currentPage);
        }

        // =========================================================================
        // 2. FUNGSI AUTENTIKASI (LOGIN/LOGOUT/TOGGLE)
        // =========================================================================

        window.login = function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const statusText = document.getElementById('auth-status');

            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    statusText.textContent = 'Login Berhasil!';
                    statusText.style.color = '#27ae60'; 
                })
                .catch((error) => {
                    let errorMessage = `Login Gagal: ${error.message}`;
                    if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                        errorMessage = 'Email atau Password salah. Mohon coba lagi.';
                    }
                    document.getElementById('login-error-status').textContent = errorMessage;
                    document.getElementById('login-error-status').style.color = '#e74c3c';
                });
        }

        window.logout = function() {
            auth.signOut().then(() => {
                document.getElementById('auth-status').textContent = 'Anda telah Logout.';
                document.getElementById('auth-status').style.color = '#e74c3c';
            });
        }
        
        // FUNGSI BARU: Toggle tampilan input Email/Password
        window.toggleLoginInputs = function() {
            const loginArea = document.getElementById('login-inputs-area');
            const toggleBtn = document.getElementById('login-toggle-btn');

            if (loginArea.style.display === 'none' || loginArea.style.display === '') {
                // Tampilkan input dan ubah teks tombol
                loginArea.style.display = 'block';
                toggleBtn.textContent = 'Sembunyikan Login Bendahara';
            } else {
                // Sembunyikan input dan kembalikan teks tombol
                loginArea.style.display = 'none';
                toggleBtn.textContent = 'Tampilkan Login Bendahara';
            }
        }

        auth.onAuthStateChanged((user) => {
            // Ambil elemen-elemen baru
            const loginToggleBtn = document.getElementById('login-toggle-btn');
            const loginInputsArea = document.getElementById('login-inputs-area');
            const adminContainer = document.getElementById('input-control-container');
            
            if (!adminContainer) return; 

            if (user) {
                // JIKA SUDAH LOGIN
                
                // Sembunyikan semua yang berhubungan dengan login/toggle
                if (loginToggleBtn) loginToggleBtn.style.display = 'none';
                if (loginInputsArea) loginInputsArea.style.display = 'none';
                
                // Tampilkan input kontrol admin
                adminContainer.style.display = 'block';
                
                document.getElementById('auth-status').textContent = 'Selamat datang, Bendahara!';
                document.getElementById('auth-status').style.color = '#27ae60';
            } else {
                // JIKA BELUM LOGIN
                
                // Tampilkan tombol toggle (pemicu login)
                if (loginToggleBtn) loginToggleBtn.style.display = 'block';
                
                // Pastikan area input disembunyikan
                if (loginInputsArea) loginInputsArea.style.display = 'none';

                // Sembunyikan input kontrol admin
                adminContainer.style.display = 'none';
            }
            loadData();
        });

        // =========================================================================
        // 3. FUNGSI DATA (INPUT, LOAD, HAPUS, RESET)
        // =========================================================================
        
        window.addTransaction = function() {
            const tanggal = document.getElementById('input-tanggal').value;
            const uraian = document.getElementById('input-uraian').value;
            const danaMasuk = parseInt(document.getElementById('input-masuk').value) || 0;
            const danaKeluar = parseInt(document.getElementById('input-keluar').value) || 0;

            if (!tanggal || !uraian || (danaMasuk === 0 && danaKeluar === 0)) {
                alert("Tanggal dan Uraian wajib diisi, dan salah satu Dana harus diisi!");
                return;
            }
            if (danaMasuk > 0 && danaKeluar > 0) {
                alert("Hanya boleh mengisi Dana Masuk atau Dana Keluar, tidak keduanya!");
                return;
            }

            db.collection(FINANCE_COLLECTION).add({
                tanggal: tanggal,
                uraian: uraian,
                danaMasuk: danaMasuk,
                danaKeluar: danaKeluar,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                document.getElementById('transaction-form').reset();
                document.getElementById('auth-status').textContent = "Transaksi berhasil dicatat!";
                document.getElementById('auth-status').style.color = '#27ae60';
            })
            .catch((error) => {
                document.getElementById('auth-status').textContent = "Error menyimpan data: " + error.message;
                document.getElementById('auth-status').style.color = '#e74c3c';
            });
        }

        function setupTableHeaders(isLoggedIn) {
            const table = document.getElementById('finance-table');
            const headerRow = table.querySelector('thead tr');
            
            const existingActionHeader = headerRow.querySelector('th:last-child');
            const hasActionHeader = existingActionHeader && existingActionHeader.textContent.trim() === 'Aksi';
            
            if (hasActionHeader && !isLoggedIn) {
                existingActionHeader.remove();
            } 
            else if (!hasActionHeader && isLoggedIn) {
                const actionHeader = document.createElement('th');
                actionHeader.textContent = 'Aksi';
                actionHeader.style.width = '10%';
                headerRow.appendChild(actionHeader);
            }
        }


        window.loadData = function() {
            const tableBody = document.getElementById('finance-body');
            const tableFooter = document.getElementById('finance-footer');
            const user = auth.currentUser;
            const isLoggedIn = !!user; 
            
            setupTableHeaders(isLoggedIn);

            db.collection(FINANCE_COLLECTION).orderBy("tanggal", "asc").get()
            .then((snapshot) => {
                tableBody.innerHTML = '';
                tableFooter.innerHTML = '';
                
                allDataRows = []; 

                let saldo = 0;
                let totalMasuk = 0;
                let totalKeluar = 0;
                let no = 1;
                
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const id = doc.id;

                    const danaMasuk = data.danaMasuk || 0;
                    const danaKeluar = data.danaKeluar || 0;

                    saldo += danaMasuk - danaKeluar;
                    totalMasuk += danaMasuk;
                    totalKeluar += danaKeluar;

                    const row = tableBody.insertRow();
                    row.insertCell(0).textContent = no++;
                    row.insertCell(1).textContent = data.tanggal;
                    row.insertCell(2).textContent = data.uraian;
                    
                    const masukCell = row.insertCell(3);
                    masukCell.textContent = danaMasuk > 0 ? formatRupiah(danaMasuk) : '-';
                    masukCell.style.textAlign = 'right';

                    const keluarCell = row.insertCell(4);
                    keluarCell.textContent = danaKeluar > 0 ? formatRupiah(danaKeluar) : '-';
                    keluarCell.style.textAlign = 'right';

                    const saldoCell = row.insertCell(5);
                    saldoCell.textContent = formatRupiah(saldo);
                    saldoCell.style.textAlign = 'right';
                    if (saldo < 0) {
                        saldoCell.className = 'saldo-minus';
                    } else if (saldo > 0) {
                        saldoCell.className = 'saldo-plus';
                    }

                    if (isLoggedIn) {
                        const actionCell = row.insertCell(6);
                        const safeUraian = (data.uraian || '').replace(/'/g, "\\'"); 
                        
                        actionCell.innerHTML = `
                            <button class="aksi-btn" onclick="editTransactionPrompt('${id}', '${data.tanggal}', '${safeUraian}', ${danaMasuk}, ${danaKeluar})">Edit</button>
                            <button class="aksi-btn" onclick="deleteTransaction('${id}')" style="background-color: #e74c3c;">Hapus</button>
                        `;
                    }
                    
                    allDataRows.push(row);
                });
                
                setupPagination();

                const footerRow = tableFooter.insertRow();
                footerRow.className = 'total-row';
                
                const totalLabelCell = footerRow.insertCell(0);
                totalLabelCell.colSpan = 3; 
                totalLabelCell.textContent = 'TOTAL AKHIR:';
                totalLabelCell.style.textAlign = 'right'; 

                const totalMasukCell = footerRow.insertCell(1);
                totalMasukCell.textContent = formatRupiah(totalMasuk);
                totalMasukCell.style.textAlign = 'right';

                const totalKeluarCell = footerRow.insertCell(2);
                totalKeluarCell.textContent = formatRupiah(totalKeluar);
                totalKeluarCell.style.textAlign = 'right';

                const finalSaldoCell = footerRow.insertCell(3);
                finalSaldoCell.textContent = formatRupiah(saldo);
                finalSaldoCell.style.textAlign = 'right';
                if (saldo < 0) {
                    finalSaldoCell.className = 'saldo-minus';
                } else if (saldo > 0) {
                    finalSaldoCell.className = 'saldo-plus';
                }

                if (isLoggedIn) {
                    const emptyActionCell = footerRow.insertCell(4);
                    emptyActionCell.textContent = '';
                }
            }).catch(error => {
                console.error("Error loading data:", error);
            });
        }


        window.deleteTransaction = function(docId) {
            if (!auth.currentUser) {
                alert("Anda harus login sebagai admin untuk menghapus data.");
                return;
            }
            
            if (confirm("Yakin ingin menghapus transaksi ini?")) {
                db.collection(FINANCE_COLLECTION).doc(docId).delete()
                .then(() => {
                    document.getElementById('auth-status').textContent = "Transaksi berhasil dihapus!";
                    document.getElementById('auth-status').style.color = '#27ae60';
                })
                .catch((error) => {
                    document.getElementById('auth-status').textContent = "Error menghapus: Pastikan Anda masih login. " + error.message;
                    document.getElementById('auth-status').style.color = '#e74c3c';
                });
            }
        }
        
        // =========================================================================
        // 4. FUNGSI EDIT DATA (MODAL)
        // =========================================================================

        let currentEditingId = null; 

        window.editTransactionPrompt = function(id, tanggal, uraian, masuk, keluar) {
            if (!auth.currentUser) {
                alert("Anda harus login sebagai admin untuk mengedit data.");
                return;
            }
            
            currentEditingId = id; 
            
            // FIX: Mengisi input hidden ID
            document.getElementById('modal-id').value = id; 
            
            // FIX: Mengisi input TANGGAL
            document.getElementById('edit-tanggal').value = tanggal;
            
            document.getElementById('edit-uraian').value = uraian;
            document.getElementById('edit-masuk').value = masuk > 0 ? masuk : ''; 
            document.getElementById('edit-keluar').value = keluar > 0 ? keluar : '';
            document.getElementById('modal-status').textContent = ''; 

            document.getElementById('editModal').style.display = 'block';
        }
        
        window.saveEditChanges = function() {
            if (!currentEditingId) return;

            const id = document.getElementById('modal-id').value;
            const newTanggal = document.getElementById('edit-tanggal').value;
            
            const newUraian = document.getElementById('edit-uraian').value.trim();
            const newMasukValue = document.getElementById('edit-masuk').value.trim();
            const newKeluarValue = document.getElementById('edit-keluar').value.trim();
            
            const finalMasuk = parseInt(newMasukValue) || 0;
            const finalKeluar = parseInt(newKeluarValue) || 0;
            const modalStatus = document.getElementById('modal-status');

            if (!newTanggal || !newUraian) {
                modalStatus.textContent = "Tanggal dan Uraian tidak boleh kosong!";
                modalStatus.style.color = '#e74c3c';
                return;
            }
            if (finalMasuk < 0 || finalKeluar < 0) {
                modalStatus.textContent = "Dana Masuk/Keluar tidak boleh negatif.";
                 modalStatus.style.color = '#e74c3c';
                return;
            }
            if (finalMasuk > 0 && finalKeluar > 0) {
                modalStatus.textContent = "Hanya boleh mengisi Dana Masuk atau Dana Keluar, tidak keduanya.";
                 modalStatus.style.color = '#e74c3c';
                return;
            }

            modalStatus.textContent = 'Menyimpan...';
            updateTransaction(id, newTanggal, newUraian, finalMasuk, finalKeluar);
        }
        
        async function updateTransaction(id, tanggal, uraian, danaMasuk, danaKeluar) {
            try {
                await db.collection(FINANCE_COLLECTION).doc(id).update({
                    tanggal: tanggal,
                    uraian: uraian,
                    danaMasuk: danaMasuk,
                    danaKeluar: danaKeluar
                });
                document.getElementById('modal-status').textContent = 'Transaksi berhasil diupdate!';
                document.getElementById('modal-status').style.color = '#27ae60';
                setTimeout(() => {
                    document.getElementById('editModal').style.display = 'none';
                }, 1000); 
                
                document.getElementById('auth-status').textContent = 'Transaksi berhasil diupdate!';
                document.getElementById('auth-status').style.color = '#27ae60';
            } catch (error) {
                document.getElementById('modal-status').textContent = `Gagal mengupdate transaksi: ${error.message}`;
                document.getElementById('modal-status').style.color = '#e74c3c';
                console.error("Error updating document: ", error);
            }
        }
        
        // =========================================================================
        // 5. FUNGSI UNDUH PDF & RESET
        // =========================================================================
        
        window.resetData = function() {
            if (!auth.currentUser) {
                alert("Anda harus login sebagai admin untuk mereset data.");
                return;
            }

            if (!confirm("PERINGATAN! Ini akan menghapus SEMUA data laporan keuangan. Lanjutkan?")) {
                return;
            }

            db.collection(FINANCE_COLLECTION).get().then((snapshot) => {
                const batch = db.batch();
                snapshot.docs.forEach((doc) => {
                    batch.delete(doc.ref);
                });

                return batch.commit();
            }).then(() => {
                document.getElementById('auth-status').textContent = "Semua data laporan berhasil direset (dihapus).";
                document.getElementById('auth-status').style.color = '#27ae60';
            }).catch((error) => {
                document.getElementById('auth-status').textContent = "Gagal mereset data: " + error.message;
                document.getElementById('auth-status').style.color = '#e74c3c';
            });
        }


        window.downloadPDF = function() {
            if(allDataRows.length === 0){
                alert("Tidak ada data untuk dibuat laporan PDF.");
                return;
            }
            
            // ... (Kode download PDF tetap sama) ...
            alert("Fungsi download PDF sedang diproses...");
        }

        // Event listeners untuk Modal
        function setupModalListeners() {
            const modal = document.getElementById('editModal');
            const closeBtn = document.querySelector('.close-btn');
            const saveBtn = document.getElementById('save-edit-btn');
            
            if (modal && closeBtn) {
                closeBtn.onclick = function() {
                    modal.style.display = 'none';
                }
                
                window.onclick = function(event) {
                    if (event.target == modal) {
                        modal.style.display = 'none';
                    }
                }
            }
            
            if(saveBtn) saveBtn.onclick = saveEditChanges;
        }

        document.addEventListener('DOMContentLoaded', setupModalListeners);
        document.addEventListener('DOMContentLoaded', loadData);
    </script>

</body>
