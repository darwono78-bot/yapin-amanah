<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laporan Keuangan | Yayasan Pendidikan Islam Nurul Huda</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        /* [ ... STYLE CSS UMUM ANDA TETAP SAMA ... ] */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background:
                linear-gradient(rgba(0, 40, 0, 0.85), rgba(0, 40, 0, 0.85)),
                url('background-masjid-hijau-3.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            overflow-x: hidden;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        /* Tambahkan CSS Khusus untuk Laporan agar tampilan rapi */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        .section {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.5s ease-out forwards;
        }

        h1, h2 {
            text-align: center;
            color: #fff;
            margin-bottom: 20px;
        }

        /* Login */
        #login-section {
            display: none;
            max-width: 400px;
            margin: 50px auto;
            text-align: center;
        }

        /* Form Input */
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background-color: #333;
            color: #fff;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            margin-right: 10px;
        }
        button.logout-btn { background-color: #dc3545; }
        button.reset-btn { background-color: #6c757d; }
        button.edit-btn { background-color: #ffc107; color: #333; }
        button.delete-btn { background-color: #dc3545; }
        button.pdf-btn { background-color: #28a745; }

        /* Summary */
        .summary {
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin-bottom: 20px;
        }
        .summary-box {
            background-color: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 8px;
            flex: 1;
            margin: 0 10px;
        }
        .summary-box h3 { margin-bottom: 5px; }

        /* Table */
        .report-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table th, table td {
            padding: 10px;
            border: 1px solid #555;
            text-align: right;
            color: #fff;
        }
        table th {
            background-color: rgba(0, 0, 0, 0.5);
            font-weight: bold;
            text-align: center;
        }
        table td:first-child { text-align: center; }
        table td:nth-child(3) { text-align: left; }
        .aksi-cell { width: 150px; text-align: center !important; }
        .kategori-cell { text-align: center !important; }

        /* Modal Edit */
        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4); 
        }
        .modal-content {
            background-color: #222;
            margin: 10% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 500px;
            border-radius: 8px;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close:hover, .close:focus {
            color: white;
            text-decoration: none;
            cursor: pointer;
        }
        .modal-content h2 { margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Laporan Keuangan Yayasan</h1>

        <div id="login-section" class="section">
            <h2>Hanya Admin</h2>
            <input type="email" id="email" placeholder="Email Admin" class="input-group-field" />
            <input type="password" id="password" placeholder="Password" class="input-group-field" />
            <button onclick="login()">Login</button>
        </div>

        <div id="report-content" style="display: none;">
            
            <div class="section">
                <button onclick="logout()" class="logout-btn">Logout</button>
                <button onclick="generatePDF()" class="pdf-btn">Download PDF Laporan</button>
            </div>

            <form id="add-transaction-form" class="section">
                <h2>Tambah Transaksi Baru</h2>
                <div class="input-group">
                    <label for="tanggal-input">Tanggal:</label>
                    <input type="date" id="tanggal-input" required />
                </div>

                <div class="input-group">
                    <label for="uraian-input">Uraian:</label>
                    <input type="text" id="uraian-input" required />
                </div>
                
                <div class="input-group">
                    <label for="kategori-input">Kategori:</label>
                    <select id="kategori-input" required>
                        <option value="">-- Pilih Kategori --</option>
                        </select>
                </div>

                <div class="input-group">
                    <label for="dana-masuk-input">Dana Masuk:</label>
                    <input type="text" id="dana-masuk-input" placeholder="Contoh: 500.000" />
                </div>

                <div class="input-group">
                    <label for="dana-keluar-input">Dana Keluar:</label>
                    <input type="text" id="dana-keluar-input" placeholder="Contoh: 100.000" />
                </div>

                <button type="submit" onclick="addTransaction(event)">Tambah Transaksi</button>
                <button type="button" onclick="resetData()" class="reset-btn">Reset Semua Data</button>
            </form>
            
            <div class="summary section">
                <div class="summary-box">
                    <h3>Total Dana Masuk</h3>
                    <p id="total-masuk">Rp 0</p>
                </div>
                <div class="summary-box">
                    <h3>Total Dana Keluar</h3>
                    <p id="total-keluar">Rp 0</p>
                </div>
                <div class="summary-box">
                    <h3>Saldo Akhir</h3>
                    <p id="saldo-akhir" style="font-weight: bold;">Rp 0</p>
                </div>
            </div>

            <div class="report-container section" id="laporan-table">
                <h2>Tabel Laporan Transaksi</h2>
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th style="width: 100px;">Tanggal</th>
                            <th style="width: 300px;">Uraian</th>
                            <th style="width: 150px;">Kategori</th>
                            <th style="width: 150px;">Dana Masuk</th>
                            <th style="width: 150px;">Dana Keluar</th>
                            <th style="width: 150px;">Saldo</th>
                            <th style="width: 150px;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="finance-table-body">
                        <tr><td colspan="8" style="text-align: center;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>

        </div> </div> <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Edit Transaksi</h2>
            <div class="input-group">
                <label for="edit-tanggal">Tanggal:</label>
                <input type="date" id="edit-tanggal" />
            </div>
            <div class="input-group">
                <label for="edit-uraian">Uraian:</label>
                <input type="text" id="edit-uraian" />
            </div>
            <div class="input-group">
                <label for="edit-kategori">Kategori:</label>
                <select id="edit-kategori"></select>
            </div>
            <div class="input-group">
                <label for="edit-masuk">Dana Masuk:</label>
                <input type="text" id="edit-masuk" />
            </div>
            <div class="input-group">
                <label for="edit-keluar">Dana Keluar:</label>
                <input type="text" id="edit-keluar" />
            </div>
            <button id="save-edit-btn">Simpan Perubahan</button>
        </div>
    </div>


<script>
    // =========================================================================
    // FIREBASE CONFIGURATION (PASTIKAN INI ADALAH CONFIG ANDA)
    // =========================================================================
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY", // GANTI DENGAN KODE API KAKAK
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "SENDER_ID",
        appId: "APP_ID"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    
    const db = firebase.firestore();
    const auth = firebase.auth();
    
    // FIX 2: NAMA KOLEKSI HARUS 'laporan'
    const FINANCE_COLLECTION = 'laporan'; 

    // Daftar Kategori untuk dropdown
    const CATEGORIES = [
        'Donasi/Sumbangan',
        'Infaq Sekolah',
        'Bantuan Pemerintah',
        'Pengeluaran Operasional',
        'Pengeluaran Pendidikan',
        'Pengeluaran Sosial',
        'Lain-lain Masuk',
        'Lain-lain Keluar'
    ];


    // =========================================================================
    // UTILITY FUNCTIONS
    // =========================================================================

    // Fungsi untuk memformat angka menjadi Rupiah (termasuk konversi dari string ke number)
    function formatRupiah(angka) {
        // Konversi angka ke string, hapus semua non-digit kecuali tanda minus, dan konversi ke angka
        const numberValue = parseInt(String(angka).replace(/[^\d-]/g, '')) || 0;
        
        const isNegative = numberValue < 0;
        const absValue = Math.abs(numberValue);

        const rupiah = absValue.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        
        return (isNegative ? '- Rp ' : 'Rp ') + rupiah;
    }

    // Fungsi untuk mengisi opsi kategori
    function fillCategoryOptions() {
        const selects = document.querySelectorAll('#kategori-input, #edit-kategori');
        selects.forEach(select => {
            select.innerHTML = '<option value="">-- Pilih Kategori --</option>';
            CATEGORIES.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                select.appendChild(option);
            });
        });
    }

    // Fungsi untuk menampilkan/menyembunyikan konten berdasarkan status login
    function toggleTableDisplay(isLoggedIn) {
        document.getElementById('login-section').style.display = isLoggedIn ? 'none' : 'block';
        document.getElementById('report-content').style.display = isLoggedIn ? 'block' : 'none';
        if (isLoggedIn) {
            loadData();
        }
    }


    // =========================================================================
    // FIREBASE AUTH
    // =========================================================================

    auth.onAuthStateChanged(user => {
        toggleTableDisplay(!!user);
    });

    function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        auth.signInWithEmailAndPassword(email, password)
            .then(() => {
                alert('Login Berhasil!');
            })
            .catch(error => {
                alert('Login Gagal: ' + error.message);
            });
    }

    function logout() {
        auth.signOut().then(() => {
            alert('Logout Berhasil!');
            document.getElementById('finance-table-body').innerHTML = '<tr><td colspan="8" style="text-align: center;">Silakan Login.</td></tr>';
        }).catch(error => {
            console.error('Logout error:', error);
        });
    }


    // =========================================================================
    // FUNGSI UTAMA TRANSAKSI
    // =========================================================================

    // FIX 3: Fungsi addTransaction yang menggunakan ID input yang benar dan konversi angka
    async function addTransaction(event) {
        event.preventDefault();

        // Mengambil nilai dari input form (ID sudah disesuaikan dengan HTML)
        const tanggalInput = document.getElementById('tanggal-input').value;
        const uraianInput = document.getElementById('uraian-input').value;
        const kategoriInput = document.getElementById('kategori-input').value;
        const danaMasukInput = document.getElementById('dana-masuk-input').value;
        const danaKeluarInput = document.getElementById('dana-keluar-input').value;

        if (!tanggalInput || !uraianInput || !kategoriInput) {
            alert('Semua bidang (Tanggal, Uraian, Kategori) harus diisi.');
            return;
        }

        // Konversi Agresif: Menghapus semua non-digit dari input string untuk mendapatkan angka
        const danaMasukValue = parseInt(String(danaMasukInput).replace(/[^\d]/g, '')) || 0;
        const danaKeluarValue = parseInt(String(danaKeluarInput).replace(/[^\d]/g, '')) || 0;

        // Validasi, pastikan salah satu harus diisi (tidak boleh keduanya nol)
        if (danaMasukValue === 0 && danaKeluarValue === 0) {
            alert('Dana Masuk atau Dana Keluar harus diisi.');
            return;
        }

        const newTransaction = {
            tanggal: tanggalInput,
            uraian: uraianInput,
            kategori: kategoriInput,
            // FIX: Simpan ke database dengan format underscore: 'dana_masuk' dan 'dana_keluar'
            // Nilai disimpan sebagai STRING dengan format Rupiah agar data lama tetap kompatibel
            dana_masuk: danaMasukValue > 0 ? formatRupiah(danaMasukValue).replace('Rp ', '') : '0',
            dana_keluar: danaKeluarValue > 0 ? formatRupiah(danaKeluarValue).replace('Rp ', '') : '0',
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
            await db.collection(FINANCE_COLLECTION).add(newTransaction);
            alert('Transaksi Berhasil Ditambahkan!');
            
            // Reset Form dan Muat Ulang Data
            document.getElementById('add-transaction-form').reset();
            loadData();
        } catch (error) {
            console.error("Error adding document: ", error);
            alert('Gagal menambahkan transaksi. Cek console.');
        }
    }

    // FIX 4: Fungsi loadData yang menggunakan field 'dana_masuk' dan konversi angka agresif
    async function loadData() {
        const isLoggedIn = !!auth.currentUser;
        const tableBody = document.getElementById('finance-table-body');
        const totalMasukElement = document.getElementById('total-masuk');
        const totalKeluarElement = document.getElementById('total-keluar');
        const saldoAkhirElement = document.getElementById('saldo-akhir');

        if (!tableBody || !isLoggedIn) return; 

        tableBody.innerHTML = '<tr><td colspan="8" style="text-align: center;">Memuat data...</td></tr>';

        try {
            // FIX: Mengambil data dari koleksi 'laporan'
            const snapshot = await db.collection(FINANCE_COLLECTION).orderBy("timestamp", "asc").get();
            let html = '';
            let saldo = 0;
            let totalMasuk = 0;
            let totalKeluar = 0;
            let no = 1;

            snapshot.forEach((doc) => {
                const data = doc.data();
                const docId = doc.id;

                const rawDanaMasuk = data.dana_masuk || 0; 
                const rawDanaKeluar = data.dana_keluar || 0;
                
                // FIX: Konversi Agresif, menghapus semua non-digit (termasuk titik/koma)
                const danaMasuk = parseInt(String(rawDanaMasuk).replace(/[^\d]/g, '')) || 0;
                const danaKeluar = parseInt(String(rawDanaKeluar).replace(/[^\d]/g, '')) || 0;

                saldo += danaMasuk - danaKeluar;
                totalMasuk += danaMasuk;
                totalKeluar += danaKeluar;

                const saldoColor = saldo < 0 ? 'color: #cc0000;' : 'color: #008000;';
                
                const kategoriCell = '<td class="kategori-cell">' + (data.kategori || '-') + '</td>';
                const aksiCell = 
                    '<td class="aksi-cell">' +
                        '<button onclick="editTransactionPrompt(\'' + docId + '\')" class="edit-btn">Edit</button>' +
                        '<button onclick="deleteTransaction(\'' + docId + '\')" class="delete-btn">Hapus</button>' +
                    '</td>';

                html += 
                    '<tr>' +
                        '<td>' + no++ + '</td>' +
                        '<td>' + data.tanggal + '</td>' +
                        '<td style="text-align: left;">' + data.uraian + '</td>' +
                        kategoriCell +
                        '<td class="dana-masuk">' + formatRupiah(danaMasuk) + '</td>' +
                        '<td class="dana-keluar">' + formatRupiah(danaKeluar) + '</td>' +
                        '<td style="' + saldoColor + '">' + formatRupiah(saldo) + '</td>' +
                        aksiCell +
                    '</tr>';
            });

            if (html === '') {
                html = '<tr><td colspan="8" style="text-align: center;">Belum ada transaksi yang tercatat.</td></tr>';
            }
            
            tableBody.innerHTML = html;
            
            const finalSaldo = totalMasuk - totalKeluar;
            const finalSaldoColor = finalSaldo < 0 ? 'color: #cc0000;' : 'color: #008000;';

            if (totalMasukElement) totalMasukElement.textContent = formatRupiah(totalMasuk);
            if (totalKeluarElement) totalKeluarElement.textContent = formatRupiah(totalKeluar);
            if (saldoAkhirElement) {
                saldoAkhirElement.textContent = formatRupiah(finalSaldo);
                saldoAkhirElement.style.color = finalSaldoColor;
            }

        } catch (error) {
            console.error("Error loading data: ", error);
            tableBody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: red;">Gagal memuat data. Cek error console.</td></tr>';
        }
    }


    // =========================================================================
    // FUNGSI EDIT DAN DELETE
    // =========================================================================

    // Variabel untuk menyimpan ID dokumen yang sedang diedit
    let currentEditDocId = null;

    async function editTransactionPrompt(docId) {
        currentEditDocId = docId;
        const doc = await db.collection(FINANCE_COLLECTION).doc(docId).get();

        if (doc.exists) {
            const data = doc.data();
            
            // Konversi Agresif untuk menampilkan angka di modal
            const danaMasukValue = parseInt(String(data.dana_masuk || 0).replace(/[^\d]/g, '')) || 0;
            const danaKeluarValue = parseInt(String(data.dana_keluar || 0).replace(/[^\d]/g, '')) || 0;

            // FIX: Menggunakan ID input modal yang benar
            document.getElementById('edit-tanggal').value = data.tanggal;
            document.getElementById('edit-uraian').value = data.uraian;
            document.getElementById('edit-kategori').value = data.kategori || '';
            document.getElementById('edit-masuk').value = danaMasukValue > 0 ? danaMasukValue.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".") : '';
            document.getElementById('edit-keluar').value = danaKeluarValue > 0 ? danaKeluarValue.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".") : '';

            document.getElementById('editModal').style.display = 'block';
        } else {
            alert('Dokumen tidak ditemukan.');
        }
    }

    async function saveEditChanges() {
        if (!currentEditDocId) return;

        // FIX: Mengambil nilai dari input modal yang benar
        const tanggal = document.getElementById('edit-tanggal').value;
        const uraian = document.getElementById('edit-uraian').value;
        const kategori = document.getElementById('edit-kategori').value;
        const danaMasukInput = document.getElementById('edit-masuk').value;
        const danaKeluarInput = document.getElementById('edit-keluar').value;

        // Konversi Agresif saat menyimpan
        const danaMasukValue = parseInt(String(danaMasukInput).replace(/[^\d]/g, '')) || 0;
        const danaKeluarValue = parseInt(String(danaKeluarInput).replace(/[^\d]/g, '')) || 0;

        if (!tanggal || !uraian || !kategori || (danaMasukValue === 0 && danaKeluarValue === 0)) {
            alert('Semua bidang wajib diisi.');
            return;
        }

        const updatedTransaction = {
            tanggal: tanggal,
            uraian: uraian,
            kategori: kategori,
            // FIX: Simpan ke database dengan format underscore dan String format rupiah
            dana_masuk: danaMasukValue > 0 ? formatRupiah(danaMasukValue).replace('Rp ', '') : '0',
            dana_keluar: danaKeluarValue > 0 ? formatRupiah(danaKeluarValue).replace('Rp ', '') : '0',
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
            await db.collection(FINANCE_COLLECTION).doc(currentEditDocId).update(updatedTransaction);
            alert('Perubahan Berhasil Disimpan!');
            document.getElementById('editModal').style.display = 'none';
            loadData();
        } catch (error) {
            console.error("Error updating document: ", error);
            alert('Gagal menyimpan perubahan. Cek console.');
        }
    }

    function deleteTransaction(docId) {
        if (confirm('Apakah Anda yakin ingin menghapus transaksi ini?')) {
            db.collection(FINANCE_COLLECTION).doc(docId).delete().then(() => {
                alert('Transaksi Berhasil Dihapus!');
                loadData();
            }).catch(error => {
                console.error("Error removing document: ", error);
                alert('Gagal menghapus transaksi. Cek console.');
            });
        }
    }

    function resetData() {
        if (confirm('PERINGATAN! Anda akan menghapus SEMUA data laporan. Lanjutkan?')) {
            // Ini adalah operasi yang sangat berbahaya dan memakan waktu
            db.collection(FINANCE_COLLECTION).get().then(snapshot => {
                const batch = db.batch();
                snapshot.docs.forEach(doc => {
                    batch.delete(doc.ref);
                });
                return batch.commit();
            }).then(() => {
                alert('SEMUA data berhasil dihapus!');
                loadData();
            }).catch(error => {
                console.error("Error deleting all documents: ", error);
                alert('Gagal menghapus data. Cek console.');
            });
        }
    }


    // =========================================================================
    // FUNGSI PDF
    // =========================================================================

    function generatePDF() {
        const element = document.getElementById('laporan-table');
        const opt = {
            margin:       1,
            filename:     'Laporan_Keuangan_Yayasan.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, logging: true },
            jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
        };

        // Buat salinan sementara tabel untuk PDF agar tidak ada tombol aksi
        const tableClone = element.cloneNode(true);
        const aksiHeader = tableClone.querySelector('thead tr th:last-child');
        if (aksiHeader) aksiHeader.remove();
        
        tableClone.querySelectorAll('tbody tr').forEach(row => {
            const aksiCell = row.querySelector('td:last-child');
            if (aksiCell) aksiCell.remove();
        });

        // Hapus elemen lain yang tidak perlu (misal: tombol reset)
        const buttons = tableClone.querySelectorAll('button');
        buttons.forEach(btn => btn.remove());


        html2pdf().set(opt).from(tableClone).save();
    }


    // =========================================================================
    // EVENT LISTENERS
    // =========================================================================

    function setupModalListeners() {
        const modal = document.getElementById('editModal');
        const closeBtn = document.querySelector('.close');
        const saveBtn = document.getElementById('save-edit-btn');
        
        // Tambahkan pengaman null
        if (modal) { modal.style.display = 'none'; }
        
        if (closeBtn) { 
            closeBtn.onclick = function() { 
                if (modal) modal.style.display = 'none'; 
            } 
        }
        
        window.onclick = function(event) { 
            if (modal && event.target == modal) { 
                modal.style.display = 'none'; 
            } 
        }
        
        if (saveBtn) { saveBtn.onclick = saveEditChanges; }
        
        fillCategoryOptions();
    }


    document.addEventListener('DOMContentLoaded', setupModalListeners);


    // Expose fungsi ke window
    window.login = login;
    window.logout = logout;
    window.addTransaction = addTransaction;
    window.resetData = resetData;
    window.deleteTransaction = deleteTransaction; 
    window.editTransactionPrompt = editTransactionPrompt; 
    window.generatePDF = generatePDF;

</script>
</body>
</html>
