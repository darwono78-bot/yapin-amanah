<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yayasan Pendidikan Islam Nurul Huda | Amanah & Transparan</title>
  <style>
    /* ==================================================================== */
    /* =========================== PONDASI CSS ============================ */
    /* ==================================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
      scroll-behavior: smooth;
    }

    body {
      /* Latar belakang lebih gelap dan kuat */
      background: linear-gradient(rgba(0, 40, 0, 0.95), rgba(0, 40, 0, 0.95)),
                  url('background-masjid-hijau-3.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      overflow-x: hidden;
      /* PENTING: Tambahkan padding untuk menghindari konten tertutup footer fixed */
      padding-bottom: 90px; 
    }

    /* === HEADER === */
    header {
      position: relative;
      background: rgba(0, 60, 0, 0.9);
      text-align: center;
      padding: 25px 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }
    header img {
      width: 150px;
      height: auto;
      animation: fadeIn 1.5s ease-in;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
    }
    header h1 {
      font-size: 28px;
      margin-top: 10px;
      color: #fff;
    }
    header p {
      font-size: 16px;
      color: #ccc;
    }

    /* === ANIMASI CSS === */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    
    .section {
      opacity: 0;
      transform: translateY(50px);
      transition: opacity 1s ease-out, transform 1s ease-out;
    }

    .section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* === BAGIAN SUMMARY DAN CARD === */
    .accountability-summary {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 40px 20px;
      margin-top: 20px;
    }

    .summary-card {
      background: rgba(0, 80, 0, 0.8); /* Hijau gelap transparan */
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
      padding: 25px;
      width: 100%;
      max-width: 300px;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(128, 255, 128, 0.3);
    }

    .summary-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.9);
    }

    .summary-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(to right, #4CAF50, #8BC34A);
      opacity: 0.7;
    }

    .card-title {
      font-size: 18px;
      font-weight: 500;
      color: #C8E6C9; /* Hijau muda */
      margin-bottom: 10px;
    }

    .card-value {
      font-size: 32px;
      font-weight: bold;
      color: #FFEB3B; /* Kuning terang untuk nilai utama */
      margin-top: 5px;
    }

    .card-info {
      font-size: 14px;
      color: #A5D6A7;
      margin-top: 5px;
    }

    /* Style khusus untuk saldo minus */
    .summary-card .minus {
      color: #FF5252; /* Merah untuk saldo negatif */
    }
    
    /* === TOMBOL DONASI SEKARANG (KOTAK TIMBUL) === */
    .main-actions {
        text-align: center;
        margin-top: 30px; 
        margin-bottom: 100px; /* Jarak yang cukup dari footer fixed */
    }

    .btn-donasi {
        display: inline-block;
        padding: 15px 40px;
        font-size: 24px;
        font-weight: bold;
        color: #333; 
        background-color: #FFEB3B; /* Kuning Terang */
        border: none;
        border-radius: 12px; 
        box-shadow: 0 8px 0 #FFC107, /* Bayangan bawah yang tebal (Efek Timbul) */
                    0 15px 30px rgba(0, 0, 0, 0.3); 
        text-decoration: none; 
        transition: all 0.2s ease; 
        cursor: pointer;
        text-align: center;
        min-width: 200px; 
    }

    .btn-donasi:hover {
        transform: translateY(-3px); 
        box-shadow: 0 10px 0 #FFC107,
                    0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .btn-donasi:active {
        transform: translateY(5px); /* Efek tertekan */
        box-shadow: 0 3px 0 #FFC107,
                    0 5px 10px rgba(0, 0, 0, 0.2);
    }

    /* === FOOTER LIVE CHECK (KOTAK HITAM FIXED DI BAWAH) === */
    .footer-live-check {
        position: fixed !important; 
        bottom: 0 !important;
        left: 0;
        width: 100%;
        background-color: rgba(0, 0, 0, 0.9); /* Hitam pekat */
        padding: 15px 10px;
        box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.5); 
        text-align: center;
        z-index: 9999; 
    }

    .footer-live-check .date-info {
        font-size: 16px;
        color: #ccc; 
        margin-bottom: 5px;
    }

    .footer-live-check .cek-transaksi-live {
        font-size: 18px;
        color: #9C27B0; /* Warna ungu */
        text-decoration: none;
        font-weight: bold;
        display: block; 
    }

    .footer-live-check .cek-transaksi-live:hover {
        color: #E040FB; 
    }


    /* === MEDIA QUERIES === */
    @media (max-width: 768px) {
        header h1 {
            font-size: 24px;
        }
        .summary-card {
            max-width: none;
        }
        .card-value {
            font-size: 28px;
        }
    }
  </style>

  <script type="module">
    // =========================================================================
    // IMPORT SDK MODULAR
    // =========================================================================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCLFgGblfLTDvploV-tZGYqAajIzT7t0bc",
        authDomain: "laporan-keuangan-yayasan.firebaseapp.com",
        projectId: "laporan-keuangan-yayasan",
        storageBucket: "laporan-keuangan-yayasan.firebasestorage.app",
        messagingSenderId: "616927572689",
        appId: "1:616927572689:web:3961f22c7a7899e71d8bf0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const FINANCE_COLLECTION = "laporan";
    const DONATUR_COLLECTION = "donatur";

    const formatRupiah = (angka) => {
        return new Intl.NumberFormat('id-ID', {
            style: 'currency',
            currency: 'IDR',
            minimumFractionDigits: 0
        }).format(angka);
    };

    // Fungsi untuk menampilkan tanggal hari ini secara dinamis
    function displayCurrentDate() {
        const dateElement = document.getElementById('currentDate');
        if (!dateElement) return;

        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        dateElement.textContent = now.toLocaleDateString('id-ID', options); 
    }


    async function loadMonthlySummary() {
        const now = new Date();
        const yearNow = now.getFullYear();
        
        const targetMonthsDonatur = [];
        
        // 1. Tentukan rentang 3 bulan (M, M-1, M-2) untuk Donatur
        for (let i = 0; i < 3; i++) {
            const date = new Date(yearNow, now.getMonth() - i, 1); 
            const year = date.getFullYear().toString();
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            targetMonthsDonatur.push(`${year}-${month}`);
        }
        
        const currentMonthPrefix = targetMonthsDonatur[0];
        
        // 2. Buat label rentang bulan
        const endMonthName = now.toLocaleDateString('id-ID', { month: 'short' });
        const startOfMonth = new Date(yearNow, now.getMonth() - 2, 1);
        const startMonthName = startOfMonth.toLocaleDateString('id-ID', { month: 'short' });
        const yearLabel = startOfMonth.getFullYear();
        const monthRangeLabel = `(${startMonthName} - ${endMonthName} ${yearLabel})`;

        let totalPemasukan = 0;
        let totalPengeluaran = 0;
        let totalUangDonasi = 0; // TOTAL UANG DONASI

        // 3. Ambil data LAPORAN KEUANGAN (Hanya 1 Bulan)
        try {
            const laporanSnapshot = await getDocs(collection(db, FINANCE_COLLECTION));
            laporanSnapshot.forEach(doc => {
                const data = doc.data();
                if (data.tanggal && data.tanggal.startsWith(currentMonthPrefix)) { 
                    totalPemasukan += (parseInt(data.danaMasuk) || 0);
                    totalPengeluaran += (parseInt(data.danaKeluar) || 0);
                }
            });
        } catch (error) {
            console.error("Error mengambil data Laporan Keuangan:", error);
        }

        // 4. Ambil data DONATUR (Filter 3 Bulan, hitung JUMLAH UANG)
        try {
            const donaturSnapshot = await getDocs(collection(db, DONATUR_COLLECTION));
            
            donaturSnapshot.forEach((doc) => {
                const data = doc.data();
                let docDateString = null;
                
                if (!data.tanggal) return; 

                // LOGIKA UTAMA: PRIORITAS STRING ISO 8601 (format Anda)
                if (typeof data.tanggal === 'string') {
                    docDateString = data.tanggal.substring(0, 10).trim(); 
                } 
                // Fallback jika ternyata Objek Timestamp Firestore
                else {
                    try {
                        docDateString = data.tanggal.toDate().toISOString().substring(0, 10).trim();
                    } catch (e) {
                         return;
                    }
                }
                
                // Cek Filter 3 Bulan
                const isMatch = docDateString && targetMonthsDonatur.some(prefix => docDateString.startsWith(prefix));
                
                if (isMatch) { 
                    // KRUSIAL: Ambil nilai dari field 'jumlah' dan jumlahkan
                    const jumlahDonasi = parseInt(data.jumlah) || 0; 
                    totalUangDonasi += jumlahDonasi;
                }
            });
            
        } catch (error) {
            console.error("Error fatal saat memproses Donatur:", error);
            document.getElementById('donaturBulanIni').textContent = 'ERROR'; 
        }

        // 5. Hitung dan Tampilkan Hasil
        const totalSaldo = totalPemasukan - totalPengeluaran;

        document.getElementById('donaturRangeInfo').textContent = monthRangeLabel;
        document.getElementById('donaturBulanIni').textContent = formatRupiah(totalUangDonasi); 
        document.getElementById('pemasukanBulanIni').textContent = formatRupiah(totalPemasukan);
        document.getElementById('pengeluaranBulanIni').textContent = formatRupiah(totalPengeluaran);
        
        const saldoElement = document.getElementById('saldoBulanIni');
        saldoElement.textContent = formatRupiah(totalSaldo);

        saldoElement.classList.remove('minus');
        if (totalSaldo < 0) {
            saldoElement.classList.add('minus');
        }
    }

    // Panggil kedua fungsi saat DOM Content dimuat
    document.addEventListener('DOMContentLoaded', () => {
        loadMonthlySummary();
        displayCurrentDate(); 
    });

</script>
</head>
<body>

  <header>
    <img src="logo.png" alt="Logo Yayasan Nurul Huda" />
    <h1>Laporan Keuangan & Donasi</h1>
    <p>Yayasan Pendidikan Islam Nurul Huda | Amanah & Transparan</p>
  </header>

  <main>
    <section class="accountability-summary section">

      <div class="summary-card">
        <div class="card-title">Total Donasi Terkumpul</div>
        <div class="card-value" id="donaturBulanIni">Rp0</div>
        <div class="card-info" id="donaturRangeInfo">(Memuat Data...)</div>
      </div>

      <div class="summary-card">
        <div class="card-title">Total Pemasukan Bulan Ini</div>
        <div class="card-value" id="pemasukanBulanIni">Rp0</div>
        <div class="card-info"></div>
      </div>

      <div class="summary-card">
        <div class="card-title">Total Pengeluaran Bulan Ini</div>
        <div class="card-value" id="pengeluaranBulanIni">Rp0</div>
        <div class="card-info"></div>
      </div>

      <div class="summary-card">
        <div class="card-title">Saldo Bulan Ini</div>
        <div class="card-value" id="saldoBulanIni">Rp0</div>
        <div class="card-info"></div>
      </div>

    </section>

    <div class="main-actions section">
        <a href="#" class="btn-donasi">DONASI SEKARANG</a>
    </div>

  </main>
  
  <div class="footer-live-check">
      <div class="date-info">
          <p class="today-date">Hari ini: <span id="currentDate">Memuat tanggal...</span></p>
      </div>
      <a href="laporan.html" class="cek-transaksi-live">CEK TRANSAKSI LIVE</a>
  </div>
  
  <script>
    // JavaScript untuk Animasi Scroll Anda
    const sections = document.querySelectorAll('.section');  
    window.addEventListener('scroll', () => {
        const triggerBottom = window.innerHeight * 0.85;
        sections.forEach(section => {
            const sectionTop = section.getBoundingClientRect().top;
            if(sectionTop < triggerBottom) section.classList.add('visible');
            else section.classList.remove('visible'); 
        });
    });
  </script>

</body>
</html>
